<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8B4513">
    <meta name="description" content="Random letter generator with customizable settings">
    <title>CODEX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Main View -->
        <div id="mainView" class="view active">
            <div class="header">
                <h1>CODEX</h1>
            </div>
            
            <div class="letter-display">
                <div id="letterOutput" class="letter">?</div>
            </div>
            
            <button id="generateBtn" class="generate-btn">Generate Letter</button>
            
            <button id="settingsBtn" class="settings-btn" aria-label="Settings">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M5.64 18.36l4.24-4.24m4.24-4.24l4.24-4.24"></path>
                </svg>
            </button>
        </div>

        <!-- Settings View -->
        <div id="settingsView" class="view">
            <div class="header">
                <button id="backBtn" class="icon-btn" aria-label="Back">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <h1>Settings</h1>
                <div style="width: 24px;"></div>
            </div>

            <div class="settings-content">
                <div class="setting-group">
                    <label class="setting-label">Sampling Mode</label>
                    <div class="toggle-group">
                        <button id="withReplacementBtn" class="toggle-btn">With Replacement</button>
                        <button id="withoutReplacementBtn" class="toggle-btn active">Without Replacement</button>
                    </div>
                    <p class="setting-description">With replacement: letters can repeat. Without replacement: each letter appears once before resetting.</p>
                </div>

                <div class="setting-group">
                    <label class="setting-label">Excluded Letters</label>
                    <div class="letters-grid" id="lettersGrid"></div>
                    <p class="setting-description">Tap letters to exclude them from generation.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
